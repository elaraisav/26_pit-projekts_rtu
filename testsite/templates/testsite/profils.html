<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profils</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'testsite/main-page.css' %}">
</head>
<header class="topbar">  <!-- Logo + Meklēšanas josla + Profila poga -->
    <!-- ChatGPT ieteikums -->
    <a class="logo-link" href="{% url 'testsite:sakumlapa' %}">
        <img src="{% static 'testsite/images/logo.png' %}" alt="Vietnes logo">
        <!-- Vai kāds atceras kas vietnei bija izdomātais nosaukums?-->
    </a>
    <form class="topbar-form" action="{% url 'testsite:meklesana' %}" method="get">
        <input type="search-bar" id="search-bar" placeholder="Meklējiet fotogrāfu..." aria-label="Meklēt fotogrāfu"> <!-- ChatGPT ieteikums -->
        <button type="submit" class="search-btn">Meklēt</button> <!-- jāpārliecinās, ka var meklēt bez un ar teksta meklēšanas joslā -->
    </form>
    <!-- klienta profila variants? -->
    <form> <button class="profile-btn" type="button" onclick="history.back()"> &lt;&lt; Atpakaļ </button></form>
</header>
<body>
    <div class="mainpage">
        <aside class="sidebar"> <!-- <aside> sadaļa - ChatCPT ieteikums, iedodot struktūras aptuveno maķetu -->
            <h3>Aktīvās sarakstes</h3>
            <div class="profili">
                {% for contact in chat_users %}
                <article class="profils">
                    <div class="profile-info">
                        <p>{{ contact.get_full_name|default:contact.username }}</p>
                        <a href="{% url 'testsite:chat_conversation' conversation_id=0 %}" class="chat-btn">Sarakstīties</a>
                    </div>
                </article>
                {% empty %}
                    <p>Jums pašlaik nav aktīvu sarakstu.</p>
                {% endfor %}
            </div>
        </aside>
        <main class="profile">
            <div class="container">
                <!-- Profila augšējā sadaļa -->
                <section class="profile-header">
                    <img
                        src="{% static 'testsite/images/profilepic4.jpg' %}"
                        alt="Profila attēls"
                        class="profile-avatar">

                    <div class="profile-details">
                        <h1>{{ user.get_full_name }}</h1>
                        <!-- Vienkārša aizvietošana ar profils_fotogr.html kodu izved kļūdu, jo klientam nav portfolio -->
                        <!-- Nepieciešams pielāgot, lai varētu lietot -->
                        <button type="button" class="edit-profile-btn">Rediģēt profilu </button>
                    </div>

                    <div class="profile-description">
                        <p>{{ profile.description|default:"Apraksts vēl nav pievienots." }}</p>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
