<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizācija</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'testsite/auth-reg.css' %}">
</head>
<body>
    <div class="auth">
        <h1>Autorizācija</h1>
        <!-- Connect pages via urls defined in apps urls.py -->
        <form class="auth-form" action="{% url 'testsite:autorizacija' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.non_field_errors %}
                <ul class="form-errors">
                    {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
                </ul>
            {% endif %}
            {{ form.username }}
            {{ form.password }}
            <button type="submit" id="iesniegt-btn">Iesniegt</button>
        </form>
        <div class="auth-buttons">
            <form action="{% url 'testsite:registracija' %}" method="get">
                <button id="registreties-btn">Reģistrēties</button>
            </form>
            <button id="aizmirsu-paroli-btn" disabled>Aizmirsu paroli</button> <!-- Jāaizved uz lapu aizmirsu-paroli.html-->
        </div>
    </div>
    <!-- Atkomentēt var un notestēt to -->
    <!-- <a href="{% url 'testsite:admin_panel' %}" style="color: deeppink;">Tests - Uz administratora paneli</a> -->
</body>
</html>
