<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizācija</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'testsite/auth-reg.css' %}">
</head>
<body>
    <div class="auth">
        <h1>Autorizacija</h1>
        <!-- Connect pages via urls defined in apps urls.py -->
        <form class="auth-form" action="{% url 'testsite:sakumlapa' %}" method="get">
            <input type="text" name="username" placeholder="Lietotājvārds" required>
            <input type="text"  name="password" placeholder="Parole" required> <!-- japapildina te ar konkr ievadnosacījumiem-->
            <button type="submit" id="iesniegt-btn">Iesniegt</button> <!-- Jāveic iesniegsanas funk., veiksmīhā gadījumā pārved uz sakumlapa.html -->
        </form>
        <div class="auth-buttons">
            <a href="{% url 'testsite:registracija' %}" class="button" id="registreties-btn">Reģistrēties</a> <!-- Tā kā pārejam starp lapusēm, nododot datus, lietojam <a> --> <!-- Jāaizved uz registreties.html -->
            <a href="{% url 'testsite:aizmirsu-paroli' %}" class="button" id="aizmirsu-paroli-btn">Aizmirsu paroli</a><!-- Jāaizved uz lapu aizmirsu-paroli.html-->
        </div>
    </div>
</body>
